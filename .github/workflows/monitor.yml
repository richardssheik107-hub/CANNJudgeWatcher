name: Starcup monitor

on:
  workflow_dispatch:
    inputs:
      reset_history:
        description: 'Restart active history from a new complete public snapshot'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: starcup-monitor
  cancel-in-progress: false

jobs:
  collect:
    # Cloudflare Cron and explicit manual runs share this dispatch path.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      pages_ready: ${{ steps.report.outputs.pages_ready }}
      artifact_id: ${{ steps.pages.outputs.artifact_id }}
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      WORK_DIR: data/github-runs/${{ github.run_id }}-${{ github.run_attempt }}
      SITE_DIR: data/pages-sites/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install fixed dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore history, collect one round, persist, and export
        env:
          RESET_HISTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_history || false }}
        run: |
          args=(--work-dir "$WORK_DIR" --site-output "$SITE_DIR" --poll-seconds 600 --push-state)
          if [ "$RESET_HISTORY" = 'true' ]; then
            args+=(--reset-history)
          fi
          python -m watcher.github_monitor "${args[@]}"
      - name: Summarize result and decide publication
        id: report
        env:
          PUBLISH_ENABLED: ${{ vars.ENABLE_GITHUB_PAGES == 'true' && github.event.repository.private == false }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['WORK_DIR']) / 'report.json').read_text())
          ready = report['site_ready'] and report['state_pushed'] and os.environ['PUBLISH_ENABLED'] == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('pages_ready=' + str(bool(ready)).lower() + '\n')
              output.write('site_ready=' + str(bool(report['site_ready'])).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### Public Starcup observation\n\n')
              output.write('Status: **' + report['status'] + '**\n\n')
              output.write('History persisted before page publication.\n\n')
              output.write('```json\n' + json.dumps(report, ensure_ascii=False, indent=2) + '\n```\n')
          if report['status'] in ('FAILED', 'PARTIAL'):
              print('::warning::Source collection was incomplete; prior complete board retained. Inspect runs on the snapshot page.')
          PY
      - name: Save preview from a manual trial
        if: github.event_name == 'workflow_dispatch' && steps.report.outputs.site_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starcup-preview-${{ github.run_id }}
          path: ${{ env.SITE_DIR }}
          retention-days: 1
          if-no-files-found: error
      - name: Package Pages website
        if: steps.report.outputs.pages_ready == 'true'
        id: pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ env.SITE_DIR }}
          retention-days: 1

  deploy:
    needs: collect
    if: needs.collect.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Release this completed deployment archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.collect.outputs.artifact_id }}
        run: |
          # Remove only this run's single uploaded archive after successful deploy.
          # The state branch and all ranking history remain intact.
          python - <<'PY'
          import json, os, subprocess
          artifact = os.environ['ARTIFACT_ID']
          if not artifact.isdigit():
              raise SystemExit('Invalid deployment artifact ID; nothing removed.')
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact}"
          info = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          if info['name'] != 'github-pages' or str(info['workflow_run']['id']) != os.environ['GITHUB_RUN_ID']:
              raise SystemExit('Archive ownership mismatch; nothing removed.')
          subprocess.run(['gh', 'api', '--method', 'DELETE', endpoint], check=True)
          PY
